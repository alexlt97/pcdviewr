name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── Linux native ───────────────────────────────────────────────────────────
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: pcdviewr-linux-x86_64
          path: target/release/pcdviewr

  # ── Windows cross-compile from Linux ──────────────────────────────────────
  windows:
    name: Windows (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: pcdviewr-windows-x86_64
          path: target/x86_64-pc-windows-gnu/release/pcdviewr.exe

  # ── Windows native (MSVC) ─────────────────────────────────────────────────
  windows-native:
    name: Windows native (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Upload Windows MSVC binary
        uses: actions/upload-artifact@v4
        with:
          name: pcdviewr-windows-msvc-x86_64
          path: target\release\pcdviewr.exe

  # ── Windows ZIP package (runs after windows-native) ───────────────────────
  package-windows:
    name: Package Windows ZIP
    runs-on: windows-latest
    needs: windows-native
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: pcdviewr-windows-msvc-x86_64
          path: dist/

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\pcdviewr.exe, README.md -DestinationPath dist\pcdviewr-windows-x86_64.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pcdviewr-windows-zip
          path: dist\pcdviewr-windows-x86_64.zip
